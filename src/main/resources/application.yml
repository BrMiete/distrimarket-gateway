server:
  port: ${PORT:8080}

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Compras has controller prefixes, so only its documentation path is rewritten.
        - id: compras-api-docs
          uri: lb://DISTRIMARKET-COMPRAS
          predicates:
            - Path=/compras/v3/api-docs,/compras/v3/api-docs.yaml
          filters:
            - StripPrefix=1

        - id: medios-pago-legacy
          uri: lb://DISTRIMARKET-VENTAS
          predicates:
            - Path=/medios-pago,/medios-pago/**
          filters:
            - PrefixPath=/ventas

        # 1. Enrutamiento hacia Microservicio Inventario
        - id: distrimarket-inventario
          uri: lb://DISTRIMARKET-INVENTARIO
          predicates:
            - Path=/inventario/**

        # 2. Enrutamiento hacia Microservicio Compras
        - id: distrimarket-compras
          uri: lb://DISTRIMARKET-COMPRAS
          predicates:
            - Path=/compras/**

        # 3. Enrutamiento hacia Microservicio Ventas
        - id: distrimarket-ventas
          uri: lb://DISTRIMARKET-VENTAS
          predicates:
            - Path=/ventas/**

        # 4. Enrutamiento hacia Microservicio Auth
        - id: distrimarket-auth
          uri: lb://DISTRIMARKET-AUTH
          predicates:
            - Path=/auth/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_URL:http://localhost:8761/eureka/}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    # En desarrollo todo corre en la misma máquina: registrar "localhost" evita
    # que un cambio de IP (Wi-Fi/DHCP) deje las rutas lb:// apuntando a una IP muerta.
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

# Menú desplegable "Select a definition"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    operations-sorter: method
    tags-sorter: alpha
