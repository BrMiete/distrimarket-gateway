server:
  port: ${PORT:8080}

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      # Cada microservicio se ubica por su nombre en Eureka (lb://). El servidor Eureka está en
      # eureka-server/ de este repo. Cada *_URL permite apuntar a una dirección fija si hace falta.
      discovery:
        locator:
          enabled: ${EUREKA_ENABLED:true}
          lower-case-service-id: true
      routes:
        # Compras tiene los prefijos en sus controladores: solo se reescribe su documentación.
        - id: compras-api-docs
          uri: ${COMPRAS_URL:lb://DISTRIMARKET-COMPRAS}
          predicates:
            - Path=/compras/v3/api-docs,/compras/v3/api-docs.yaml
          filters:
            - StripPrefix=1

        - id: medios-pago-legacy
          uri: ${VENTAS_URL:lb://DISTRIMARKET-VENTAS}
          predicates:
            - Path=/medios-pago,/medios-pago/**
          filters:
            - PrefixPath=/ventas

        # 1. Enrutamiento hacia Microservicio Inventario
        - id: distrimarket-inventario
          uri: ${INVENTARIO_URL:lb://DISTRIMARKET-INVENTARIO}
          predicates:
            - Path=/inventario/**

        # 2. Enrutamiento hacia Microservicio Compras
        - id: distrimarket-compras
          uri: ${COMPRAS_URL:lb://DISTRIMARKET-COMPRAS}
          predicates:
            - Path=/compras/**

        # 3. Enrutamiento hacia Microservicio Ventas
        - id: distrimarket-ventas
          uri: ${VENTAS_URL:lb://DISTRIMARKET-VENTAS}
          predicates:
            - Path=/ventas/**

        # 4. Enrutamiento hacia Microservicio de Seguridad (login, usuarios y roles)
        - id: distrimarket-auth
          uri: ${AUTH_URL:lb://DISTRIMARKET-AUTH}
          predicates:
            - Path=/auth/**

# ---------------------------------------------------------------
# Seguridad (primera capa). Cada microservicio vuelve a validar el token.
# ---------------------------------------------------------------
security:
  jwt:
    # Misma clave y emisor que distrimarket-ms-auth (JWT_SECRET / JWT_ISSUER).
    secret: ${JWT_SECRET:distrimarket-dev-secret-cambiar-en-produccion-2026}
    issuer: ${JWT_ISSUER:distrimarket-auth}
  # Rutas que no necesitan token.
  public-paths:
    - /auth/login
    - /swagger-ui.html
    - /swagger-ui/**
    - /webjars/**
    - /v3/api-docs/**
    - /openapi.yaml
    - /actuator/health/**
    - /actuator/info
  # Roles por ruta, evaluados en orden (la primera que coincide decide).
  # Lo que no figura aquí solo exige un token válido.
  rules:
    - pattern: /auth/usuarios/**
      roles: [ADMIN]
    - pattern: /auth/roles/**
      roles: [ADMIN]
    # Compras también lee los medios de pago al cargar una factura de compra.
    - pattern: /ventas/medios-pago/**
      methods: [GET]
      roles: [ADMIN, VENDEDOR, COMPRADOR]
    - pattern: /ventas/**
      roles: [ADMIN, VENDEDOR]
    - pattern: /compras/**
      roles: [ADMIN, COMPRADOR]
    # Ventas y compras consultan productos, depósitos y empleados.
    - pattern: /inventario/**
      methods: [GET]
      roles: [ADMIN, DEPOSITERO, VENDEDOR, COMPRADOR]
    - pattern: /inventario/**
      roles: [ADMIN, DEPOSITERO]

logging:
  level:
    com.distrimarket.gateway: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}

eureka:
  client:
    # El gateway se registra y busca los microservicios en Eureka. EUREKA_ENABLED=false para no usarlo.
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_URL:http://localhost:8761/eureka/}}
    register-with-eureka: true
    fetch-registry: true

# Menú desplegable "Select a definition"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    config-url: /v3/api-docs/swagger-config