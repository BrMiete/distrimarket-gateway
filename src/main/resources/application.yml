server:
  port: ${PORT:8080}

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Compras has controller prefixes, so only its documentation path is rewritten.
        - id: compras-api-docs
          uri: ${COMPRAS_URL:http://localhost:8083}
          predicates:
            - Path=/compras/v3/api-docs,/compras/v3/api-docs.yaml
          filters:
            - StripPrefix=1

        - id: medios-pago-legacy
          uri: ${VENTAS_URL:http://localhost:8082}
          predicates:
            - Path=/medios-pago,/medios-pago/**
          filters:
            - PrefixPath=/ventas

        # 1. Enrutamiento hacia Microservicio Inventario
        - id: distrimarket-inventario
          uri: ${INVENTARIO_URL:http://localhost:8081}
          predicates:
            - Path=/inventario/**

        # 2. Enrutamiento hacia Microservicio Compras
        - id: distrimarket-compras
          uri: ${COMPRAS_URL:http://localhost:8083}
          predicates:
            - Path=/compras/**

        # 3. Enrutamiento hacia Microservicio Ventas
        - id: distrimarket-ventas
          uri: ${VENTAS_URL:http://localhost:8082}
          predicates:
            - Path=/ventas/**

        # 4. Enrutamiento hacia Microservicio Auth
        - id: distrimarket-auth
          uri: ${AUTH_URL:http://localhost:8084}
          predicates:
            - Path=/auth/**

# Menú desplegable "Select a definition"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    operations-sorter: method
    tags-sorter: alpha
