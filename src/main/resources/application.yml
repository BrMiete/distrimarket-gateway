server:
  port: ${PORT:8080}

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      # Por defecto, rutas fijas por URL (sin Eureka). Para usar Eureka: EUREKA_ENABLED=true y
      # cada *_URL con el nombre registrado, por ejemplo VENTAS_URL=lb://DISTRIMARKET-VENTAS.
      discovery:
        locator:
          enabled: ${EUREKA_ENABLED:false}
          lower-case-service-id: true
      routes:
        # 1. Enrutamiento hacia Microservicio Inventario
        - id: distrimarket-inventario
          uri: ${INVENTARIO_URL:http://localhost:8081}
          predicates:
            - Path=/inventario/**

        # 2. Enrutamiento hacia Microservicio Compras
        - id: distrimarket-compras
          uri: ${COMPRAS_URL:http://localhost:8083}
          predicates:
            - Path=/compras/**

        # 3. Enrutamiento hacia Microservicio Ventas
        - id: distrimarket-ventas
          uri: ${VENTAS_URL:http://localhost:8082}
          predicates:
            - Path=/ventas/**

        # 4. Enrutamiento hacia Microservicio de Seguridad (login, usuarios y roles)
        - id: distrimarket-auth
          uri: ${AUTH_URL:http://localhost:8084}
          predicates:
            - Path=/auth/**

# ---------------------------------------------------------------
# Seguridad (primera capa). Cada microservicio vuelve a validar el token.
# ---------------------------------------------------------------
security:
  jwt:
    # Misma clave y emisor que distrimarket-ms-auth (JWT_SECRET / JWT_ISSUER).
    secret: ${JWT_SECRET:distrimarket-dev-secret-cambiar-en-produccion-2026}
    issuer: ${JWT_ISSUER:distrimarket-auth}
  # Rutas que no necesitan token.
  public-paths:
    - /auth/login
    - /swagger-ui.html
    - /swagger-ui/**
    - /webjars/**
    - /v3/api-docs/**
    - /openapi.yaml
    - /actuator/health/**
    - /actuator/info
  # Roles por ruta, evaluados en orden (la primera que coincide decide).
  # Lo que no figura aquí solo exige un token válido.
  rules:
    - pattern: /auth/usuarios/**
      roles: [ADMIN]
    - pattern: /auth/roles/**
      roles: [ADMIN]
    # Compras también lee los medios de pago al cargar una factura de compra.
    - pattern: /ventas/medios-pago/**
      methods: [GET]
      roles: [ADMIN, VENDEDOR, COMPRADOR]
    - pattern: /ventas/**
      roles: [ADMIN, VENDEDOR]
    - pattern: /compras/**
      roles: [ADMIN, COMPRADOR]
    # Ventas y compras consultan productos, depósitos y empleados.
    - pattern: /inventario/**
      methods: [GET]
      roles: [ADMIN, DEPOSITERO, VENDEDOR, COMPRADOR]
    - pattern: /inventario/**
      roles: [ADMIN, DEPOSITERO]

logging:
  level:
    com.distrimarket.gateway: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}

eureka:
  client:
    # Apagado por defecto: el grupo enruta por URL fija. EUREKA_ENABLED=true para registrarse y usar lb://.
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

# Menú desplegable "Select a definition"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    config-url: /v3/api-docs/swagger-config